spring.application.name=idpapi
spring.config.import=optional:file:../../.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/idp_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

app.openapi.title=${APP_OPENAPI_TITLE:IDP Backend API}
app.openapi.description=${APP_OPENAPI_DESCRIPTION:Intelligent Document Processing backend platform}
app.openapi.version=${APP_OPENAPI_VERSION:v1}

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:}
app.security.access-token-expiration-minutes=${APP_SECURITY_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
app.security.refresh-token-expiration-days=${APP_SECURITY_REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.security.password-reset-expiration-minutes=${APP_SECURITY_PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.security.email-verification-expiration-hours=${APP_SECURITY_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
app.security.max-failed-login-attempts=${APP_SECURITY_MAX_FAILED_LOGIN_ATTEMPTS:5}
app.security.account-lock-minutes=${APP_SECURITY_ACCOUNT_LOCK_MINUTES:15}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

app.storage.contract-dir=${APP_STORAGE_CONTRACT_DIR:storage/contracts}
app.ai.base-url=${APP_AI_BASE_URL:http://localhost:8000}

logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:INFO}